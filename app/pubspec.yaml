name: tallysaas_app
# NOTE: `name:` above is the Dart PACKAGE NAME (and, via applicationId in
# android/app/build.gradle, the Android package identity) — deliberately NOT
# rebranded; changing it would make an update look like a different app to
# already-installed devices (Play Store identity, app data, permissions).
description: Teloora — Connected Accounting companion mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ─── Networking ─────────────────────────────────────────────
  # Dio gives us interceptors (auth header + X-Company-Id forwarder),
  # cancel tokens, and structured DioException → API envelope.
  dio: ^5.4.3+1

  # ─── Media (product image gallery) ──────────────────────────
  # image_picker → native gallery/camera picker; http_parser gives us
  # MediaType so each uploaded image carries a real image/* content-type
  # (Dio would otherwise send application/octet-stream, which the API's
  # mime filter rejects).
  image_picker: ^1.1.2
  http_parser: ^4.0.2

  # ─── File picking (Bank Reconciliation CSV import) ──────────
  # file_picker → native document picker; we read bytes in-memory
  # (withData:true) and parse the CSV in Dart, mirroring the web import.
  file_picker: ^6.1.1

  # ─── External links (field sales: call / WhatsApp / open on map) ──
  # url_launcher → tel:, https://wa.me, and geo:/maps URLs from the
  # customer detail + visit tracking screens.
  url_launcher: ^6.2.5

  # ─── State management + DI ──────────────────────────────────
  # Riverpod = compile-safe DI + reactive providers. Every service and
  # piece of session state is exposed as a provider.
  flutter_riverpod: ^2.5.1

  # ─── Routing ─────────────────────────────────────────────────
  # Declarative routes + redirect-based auth guard (Splash → Login →
  # AppShell), driven off sessionProvider.
  go_router: ^14.1.0

  # ─── Storage ─────────────────────────────────────────────────
  # secure_storage   → JWT token, company id, cached user blob.
  # shared_preferences → theme choice + other non-secret toggles.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # ─── Formatting + i18n primitives ───────────────────────────
  # `intl` powers the ₹ / en_IN money + dd/MM/yyyy date formatters.
  intl: ^0.19.0

  # ─── Visual assets ───────────────────────────────────────────
  flutter_svg: ^2.0.10+1

  # ─── Charts (dashboard sparklines + report traces) ──────────
  fl_chart: ^0.68.0

  # ─── PDF print / share ──────────────────────────────────────
  # Takes the server-rendered PDF bytes (GET /reports/<type>/pdf) and opens the
  # native print / save / share sheet on iOS + Android — the report "Print/PDF".
  printing: ^5.12.0

  # ─── App auto-update (self-install of a newer APK; sideloaded, not Play) ──
  # package_info_plus → installed build number (compared to /app/version);
  # path_provider → a cache dir to save the downloaded apk; open_filex → open
  # the apk to trigger Android's package installer.
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # ─── GPS field tracking (SFA Phase 2) ───────────────────────
  # geolocator → device GPS + runtime location-permission flow for the
  # salesman's Start/End-Day punch and outlet check-in (geofence verify).
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App launcher icon (cloud tile) — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
