<?xml version="1.0" encoding="UTF-8"?>
<!--
  Teloora logo mark — square "T" chip, used for the favicon, the sidebar
  brand badge, and the desktop-agent exe icon.

  NOTE: this is a hand-drawn RECREATION of the "T" glyph from the full
  Teloora banner (web/public/img/logo-full.png), not an extraction/crop of
  that artwork — PNG raster art can't be turned into vector paths. It is
  built to sit close to the original's proportions and colours (deep navy
  stem, blue→green gradient top bar) but is an independent vector redraw.
  Do not mistake it for the source banner.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="teloora-bar" x1="10" y1="10" x2="54" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1560E0"/>
            <stop offset="1" stop-color="#45B649"/>
        </linearGradient>
        <linearGradient id="teloora-stem" x1="18" y1="18" x2="30" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1560E0"/>
            <stop offset="0.45" stop-color="#17265E"/>
            <stop offset="1" stop-color="#17265E"/>
        </linearGradient>
    </defs>

    <!-- backing chip -->
    <rect width="64" height="64" rx="14" fill="#FFFFFF"/>

    <!-- "T" top bar — rounded, blue→green gradient -->
    <rect x="9" y="10" width="46" height="14" rx="7" fill="url(#teloora-bar)"/>

    <!-- "T" stem — deep navy, gradient blue bleeding in at the top-left -->
    <rect x="19" y="18" width="14" height="36" rx="6" fill="url(#teloora-stem)"/>

    <!-- small leaf accent, echoing the leaf on the final letter of the wordmark -->
    <path d="M46 46c5-2 9 1 9 6-5 1-9-2-9-6z" fill="#45B649"/>
</svg>
